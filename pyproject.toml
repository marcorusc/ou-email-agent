[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ou-email-agent"
version = "0.1.0"
description = "Local, read-only OU email monitoring and MCP search"
requires-python = ">=3.11"
dependencies = ["keyring>=25,<26", "mcp>=1.20,<2", "plyer>=2.1,<3"]

[project.scripts]
ou-email = "ou_email_agent.cli:entrypoint"

[tool.setuptools.packages.find]
include = ["ou_email_agent*"]
